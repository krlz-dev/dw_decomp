# Inventory for the MONSTR agent/build machine.
#
# Fill in the IP from `tofu output server_ipv4`. Kept out of OpenTofu's
# generated output on purpose: a generated inventory that drifts from reality
# is worse than one line of manual editing.

[monstr_agents]
# monstr-agents ansible_host=<tofu output server_ipv4>

[monstr_agents:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
# Host key checking stays ON. Disabling it is the usual shortcut and it defeats
# the point of SSH on a box holding source code and agent credentials.
